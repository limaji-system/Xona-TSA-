<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XonaTSA - Connexion</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 40px 24px 60px;
    text-align: center;
  }
  .logo { width: 46vw; max-width: 210px; height: auto; }
  h1 {
    font-size: 20px;
    letter-spacing: 4px;
    margin: 24px 0 8px;
  }
  .subtitle {
    color: #b3b3b3;
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 28px;
  }

  .card {
    background: #0d0d0d;
    border: 1px solid #262626;
    border-radius: 28px;
    padding: 32px 22px 26px;
    text-align: left;
  }
  .avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #262626;
    margin: 0 auto 26px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar svg { width: 46px; height: 46px; fill: #fff; }

  .field {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid #3a3a3a;
    border-radius: 30px;
    padding: 14px 18px;
    margin-bottom: 16px;
  }
  .field svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 1.8; flex-shrink: 0; }
  .field input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 15px;
  }
  .field input::placeholder { color: #8a8a8a; }
  .eye-btn { background: none; border: none; padding: 0; cursor: pointer; }
  .eye-btn svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 1.6; }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 4px 4px 22px;
    font-size: 13px;
  }
  .remember { display: flex; align-items: center; gap: 8px; color: #fff; }
  .remember input { width: 16px; height: 16px; accent-color: #fff; }
  .forgot { color: #cfcfcf; text-decoration: underline; }

  .btn {
    display: block;
    width: 100%;
    padding: 15px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: bold;
    border: none;
    cursor: pointer;
    margin-bottom: 18px;
  }
  .btn-primary { background: #fff; color: #000; }
  .btn-outline {
    background: transparent;
    color: #fff;
    border: 1px solid #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn-outline svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 1.8; }

  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    color: #8a8a8a;
    font-size: 12px;
    margin: 4px 0 18px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #333;
  }
</style>
</head>
