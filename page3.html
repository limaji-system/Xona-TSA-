<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XonaTSA - Créer un compte</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 60px 24px 60px;
    text-align: center;
  }
  h1 {
    font-size: 20px;
    letter-spacing: 4px;
    margin: 0 0 8px;
  }
  .subtitle {
    color: #b3b3b3;
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 28px;
  }

  .card {
    background: #0d0d0d;
    border: 1px solid #262626;
    border-radius: 28px;
    padding: 32px 22px 26px;
    text-align: left;
  }

  .field {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid #3a3a3a;
    border-radius: 30px;
    padding: 14px 18px;
    margin-bottom: 16px;
  }
  .field svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 1.8; flex-shrink: 0; }
  .field input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 15px;
    min-width: 0;
  }
  .field input::placeholder { color: #8a8a8a; }
  .eye-btn { background: none; border: none; padding: 0; cursor: pointer; }
  .eye-btn svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 1.6; }

  .name-row {
    display: flex;
    gap: 12px;
  }
  .name-row .field { flex: 1; }

  .row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 4px 4px 22px;
    font-size: 13px;
    color: #cfcfcf;
  }
  .row input { width: 16px; height: 16px; accent-color: #fff; margin-top: 2px; flex-shrink: 0; }
  .row a { color: #fff; text-decoration: underline; }

  .btn {
    display: block;
    width: 100%;
    padding: 15px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: bold;
    border: none;
    cursor: pointer;
    margin-bottom: 18px;
  }
  .btn-primary { background: #fff; color: #000; }
  .btn-outline {
    background: transparent;
    color: #fff;
    border: 1px solid #fff;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    color: #8a8a8a;
    font-size: 12px;
    margin: 4px 0 18px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #333;
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>CRÉER UN COMPTE</h1>
  <p class="subtitle">Rejoignez XonaTSA pour gérer<br>vos événements et vos tickets.</p>

  <div class="card">

    <div class="field">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.4c-3.3 0-9.8 1.6-9.8 4.9v2.5h19.6v-2.5c0-3.3-6.5-4.9-9.8-4.9z"/></svg>
      <input type="text" placeholder="Nom et prénom">
    </div>

    <div class="field">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z"/><path d="M3 6l9 7 9-7"/></svg>
      <input type="email" placeholder="Adresse e-mail">
    </div>

    <div class="field">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input id="pwd" type="password" placeholder="Mot de passe">
      <button class="eye-btn" type="button" onclick="var p=document.getElementById('pwd'); p.type = p.type==='password' ? 'text' : 'password';">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <div class="field">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input id="pwd2" type="password" placeholder="Confirmer le mot de passe">
      <button class="eye-btn" type="button" onclick="var p=document.getElementById('pwd2'); p.type = p.type==='password' ? 'text' : 'password';">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <label class="row">
      <input type="checkbox">
      <span>J'accepte les <a href="page6.html">conditions d'utilisation</a> et la <a href="page7.html">politique de confidentialité</a>.</span>
    </label>

    <button class="btn btn-primary" type="button" onclick="localStorage.setItem('xona_session','true'); window.location.href='page8.html';">Créer un compte</button>

    <div class="divider">OU</div>

    <button class="btn btn-outline" type="button" onclick="window.location.href='page2.html';">
      Se connecter
    </button>
  </div>

</div>
</body>
</html>
