<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XonaTSA - Mot de passe oublié</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 60px 24px 60px;
    text-align: center;
  }
  h1 { font-size: 20px; letter-spacing: 4px; margin: 0 0 8px; }
  .subtitle { color: #b3b3b3; font-size: 14px; line-height: 1.5; margin: 0 0 28px; }

  .card {
    background: #0d0d0d;
    border: 1px solid #262626;
    border-radius: 28px;
    padding: 32px 22px 26px;
    text-align: left;
  }
  .field {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid #3a3a3a;
    border-radius: 30px;
    padding: 14px 18px;
    margin-bottom: 16px;
  }
  .field svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 1.8; flex-shrink: 0; }
  .field input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #fff; font-size: 15px; min-width: 0;
  }
  .field input::placeholder { color: #8a8a8a; }

  .btn {
    display: block; width: 100%; padding: 15px; border-radius: 30px;
    font-size: 15px; font-weight: bold; border: none; cursor: pointer; margin-bottom: 12px;
  }
  .btn-primary { background: #fff; color: #000; }
  .back-link { display: block; text-align: center; color: #cfcfcf; font-size: 13px; text-decoration: underline; margin-top: 6px; }

  .message {
    display: none;
    font-size: 13px;
    line-height: 1.5;
    padding: 12px 16px;
    border-radius: 14px;
    margin-bottom: 16px;
  }
  .message.success { background: #123a1e; color: #7de08a; }
  .message.error { background: #3a1212; color: #ff8a8a; }
  .message.show { display: block; }
</style>
</head>
<body>
<div class="wrap">

  <h1>MOT DE PASSE OUBLIÉ</h1>
  <p class="subtitle">Entrez votre adresse e-mail, nous vous<br>enverrons un lien pour choisir un<br>nouveau mot de passe.</p>

  <div class="card">
    <div id="msg" class="message"></div>

    <div class="field">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z"/><path d="M3 6l9 7 9-7"/></svg>
      <input id="email" type="email" placeholder="Adresse e-mail">
    </div>

    <button class="btn btn-primary" type="button" onclick="sendReset()">Envoyer le lien</button>
    <a class="back-link" href="page2.html">Retour à la connexion</a>
  </div>

</div>

<script>
  function sendReset() {
    var email = document.getElementById('email').value.trim();
    var msg = document.getElementById('msg');
    msg.className = 'message';
    if (!email || email.indexOf('@') === -1) {
      msg.textContent = "Merci d'entrer une adresse e-mail valide.";
      msg.className = 'message error show';
      return;
    }
    // Simulation : en production, un e-mail réel serait envoyé avec un lien unique.
    msg.textContent = "Un lien de réinitialisation a été envoyé à " + email + ".";
    msg.className = 'message success show';
    setTimeout(function () {
      window.location.href = 'page5.html';
    }, 1500);
  }
</script>

</body>
</html>
