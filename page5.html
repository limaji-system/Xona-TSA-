<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XonaTSA - Nouveau mot de passe</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 60px 24px 60px;
    text-align: center;
  }
  h1 { font-size: 20px; letter-spacing: 4px; margin: 0 0 8px; }
  .subtitle { color: #b3b3b3; font-size: 14px; line-height: 1.5; margin: 0 0 28px; }

  .card {
    background: #0d0d0d;
    border: 1px solid #262626;
    border-radius: 28px;
    padding: 32px 22px 26px;
    text-align: left;
  }
  .field {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid #3a3a3a;
    border-radius: 30px;
    padding: 14px 18px;
    margin-bottom: 16px;
  }
  .field svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 1.8; flex-shrink: 0; }
  .field input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #fff; font-size: 15px; min-width: 0;
  }
  .field input::placeholder { color: #8a8a8a; }
  .eye-btn { background: none; border: none; padding: 0; cursor: pointer; }
  .eye-btn svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 1.6; }

  .hint { color: #8a8a8a; font-size: 12px; margin: -8px 4px 16px; }

  .btn {
    display: block; width: 100%; padding: 15px; border-radius: 30px;
    font-size: 15px; font-weight: bold; border: none; cursor: pointer; margin-bottom: 12px;
  }
  .btn-primary { background: #fff; color: #000; }
  .back-link { display: block; text-align: center; color: #cfcfcf; font-size: 13px; text-decoration: underline; margin-top: 6px; }

  .message {
    display: none;
    font-size: 13px;
    line-height: 1.5;
    padding: 12px 16px;
    border-radius: 14px;
    margin-bottom: 16px;
  }
  .message.success { background: #123a1e; color: #7de08a; }
  .message.error { background: #3a1212; color: #ff8a8a; }
  .message.show { display: block; }
</style>
</head>
<body>
<div class="wrap">

  <h1>NOUVEAU MOT DE PASSE</h1>
  <p class="subtitle">Choisissez un nouveau mot de passe.<br>Vous n'avez pas besoin de connaître<br>l'ancien.</p>

  <div class="card">
    <div id="msg" class="message"></div>

    <div class="field">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input id="pwd1" type="password" placeholder="Nouveau mot de passe">
      <button class="eye-btn" type="button" onclick="toggle('pwd1')">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <p class="hint">8 caractères minimum.</p>

    <div class="field">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input id="pwd2" type="password" placeholder="Confirmer le mot de passe">
      <button class="eye-btn" type="button" onclick="toggle('pwd2')">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <button class="btn btn-primary" type="button" onclick="resetPwd()">Réinitialiser le mot de passe</button>
    <a class="back-link" href="page2.html">Retour à la connexion</a>
  </div>

</div>

<script>
  function toggle(id) {
    var f = document.getElementById(id);
    f.type = f.type === 'password' ? 'text' : 'password';
  }
  function resetPwd() {
    var p1 = document.getElementById('pwd1').value;
    var p2 = document.getElementById('pwd2').value;
    var msg = document.getElementById('msg');
    msg.className = 'message';

    if (p1.length < 8) {
      msg.textContent = "Le mot de passe doit contenir au moins 8 caractères.";
      msg.className = 'message error show';
      return;
    }
    if (p1 !== p2) {
      msg.textContent = "Les deux mots de passe ne correspondent pas.";
      msg.className = 'message error show';
      return;
    }
    msg.textContent = "Votre mot de passe a été mis à jour avec succès.";
    msg.className = 'message success show';
    setTimeout(function () {
      window.location.href = 'page2.html';
    }, 1500);
  }
</script>

</body>
</html>
